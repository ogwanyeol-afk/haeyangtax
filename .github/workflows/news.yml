name: 세무 뉴스 자동 갱신
on:
  schedule:
    - cron: "10 22 * * *"   # 매일 07:10 (한국시간)
    - cron: "10 8 * * *"    # 매일 17:10 (한국시간)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_news.py
      - name: 변경 시 저장
        run: |
          git config user.name "haeyangtax-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || (git commit -m "세무 뉴스 자동 갱신" && git push)
